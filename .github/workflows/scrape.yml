name: Scrape Product Tech Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          CAREERS_URL: ${{ vars.CAREERS_URL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ secrets.MAILGUN_FROM }}
          MAILGUN_TO: ${{ secrets.MAILGUN_TO }}
        run: npm run scrape

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

      - name: Commit jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          #git add data/jobs.json

          git add data/jobs.json
          git commit --allow-empty -m "Update jobs data"
          git push

          #if git diff --cached --quiet; then
          #  echo "No changes to jobs.json"
          #else
          #  git commit -m "Update jobs data"
          #  git push
          #fi
